<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Antigravity — Hand Tracking</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #07070f;
    font-family: 'DM Mono', 'Courier New', monospace;
    color: #eee;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  #container {
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  /* Webcam feed — mirrored, behind canvas */
  #video {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
    opacity: 0.45;
    z-index: 1;
  }

  /* FX canvas on top */
  #fx-canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
  }

  /* HUD overlay */
  #hud {
    position: absolute;
    top: 20px; left: 20px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .hud-title {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(175,169,236,0.7);
    margin-bottom: 4px;
  }

  .toggle-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .fx-toggle {
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 0.1em;
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid rgba(175,169,236,0.3);
    background: rgba(10,10,20,0.6);
    color: rgba(175,169,236,0.5);
    cursor: pointer;
    transition: all 0.2s;
    backdrop-filter: blur(6px);
  }

  .fx-toggle.on {
    border-color: rgba(175,169,236,0.8);
    color: #EEEDFE;
    background: rgba(83,74,183,0.25);
  }

  /* Status */
  #status {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: rgba(175,169,236,0.5);
    text-transform: uppercase;
  }

  #status.ready { color: rgba(93,202,165,0.8); }
  #status.error  { color: rgba(240,153,123,0.8); }

  /* Start screen */
  #start-screen {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #07070f;
    gap: 20px;
  }

  #start-screen h1 {
    font-size: clamp(2rem, 6vw, 4rem);
    font-weight: 300;
    letter-spacing: 0.3em;
    color: #AFA9EC;
  }

  #start-screen p {
    font-size: 12px;
    letter-spacing: 0.15em;
    color: rgba(175,169,236,0.45);
    max-width: 320px;
    text-align: center;
    line-height: 1.8;
  }

  #start-btn {
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 12px 32px;
    border-radius: 30px;
    border: 1px solid rgba(175,169,236,0.5);
    background: transparent;
    color: #AFA9EC;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 8px;
  }

  #start-btn:hover {
    background: rgba(83,74,183,0.3);
    border-color: #AFA9EC;
    color: #EEEDFE;
  }
</style>
</head>
<body>
<div id="container">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="fx-canvas"></canvas>

  <div id="hud">
    <div class="hud-title">Effects</div>
    <div class="toggle-row">
      <button class="fx-toggle on" data-fx="glow">Glow</button>
      <button class="fx-toggle on" data-fx="trails">Trails</button>
      <button class="fx-toggle on" data-fx="skeleton">Skeleton</button>
      <button class="fx-toggle on" data-fx="particles">Particles</button>
    </div>
  </div>

  <div id="status">Initialising...</div>

  <div id="start-screen">
    <h1>ANTIGRAVITY</h1>
    <p>Hand tracking with glow, trails, skeleton &amp; particle effects. Camera access required.</p>
    <button id="start-btn">Enable Camera</button>
  </div>
</div>

<!-- MediaPipe via CDN -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

<script>
// ─── CONFIG ────────────────────────────────────────────────────────────────
const FX = { glow: true, trails: true, skeleton: true, particles: true };

// Colours
const C = {
  glow:      'rgba(175,169,236,',   // purple
  trail:     [83, 74, 183],         // deep purple
  skeleton:  'rgba(93,202,165,',    // teal
  joint:     '#EEEDFE',
  wrist:     '#AFA9EC',
  particle:  [250, 199, 117],       // amber
};

// Per-hand trail history
const trailHistory  = [[], []];   // [left, right]
const particlePool  = [];
const MAX_TRAIL     = 55;

// ─── CANVAS SETUP ──────────────────────────────────────────────────────────
const video  = document.getElementById('video');
const canvas = document.getElementById('fx-canvas');
const ctx    = canvas.getContext('2d');

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ─── TOGGLE BUTTONS ────────────────────────────────────────────────────────
document.querySelectorAll('.fx-toggle').forEach(btn => {
  btn.addEventListener('click', () => {
    const fx = btn.dataset.fx;
    FX[fx] = !FX[fx];
    btn.classList.toggle('on', FX[fx]);
  });
});

// ─── PARTICLES ─────────────────────────────────────────────────────────────
function spawnParticle(x, y) {
  particlePool.push({
    x, y,
    vx: (Math.random() - 0.5) * 3.5,
    vy: -Math.random() * 4 - 1,
    life: 1,
    size: Math.random() * 3.5 + 1,
  });
}

function updateParticles() {
  for (let i = particlePool.length - 1; i >= 0; i--) {
    const p = particlePool[i];
    p.x  += p.vx;
    p.y  += p.vy;
    p.vy += 0.06;           // gravity
    p.life -= 0.022;
    if (p.life <= 0) { particlePool.splice(i, 1); continue; }
    const [r,g,b] = C.particle;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${r},${g},${b},${p.life * 0.85})`;
    ctx.fill();
  }
}

// ─── DRAW ONE HAND ─────────────────────────────────────────────────────────
// landmarks: array of 21 {x,y,z} normalised (0-1)
function drawHand(landmarks, handIndex) {
  const W = canvas.width, H = canvas.height;

  // Convert normalised → pixel (mirror x because video is mirrored)
  const pts = landmarks.map(lm => ({
    x: (1 - lm.x) * W,
    y: lm.y * H,
  }));

  const palmX = pts[0].x;
  const palmY = pts[0].y;

  // ── Glow ─────────────────────────────────────────────────────────────────
  if (FX.glow) {
    const grad = ctx.createRadialGradient(palmX, palmY, 4, palmX, palmY, 110);
    grad.addColorStop(0, C.glow + '0.22)');
    grad.addColorStop(1, C.glow + '0)');
    ctx.beginPath();
    ctx.arc(palmX, palmY, 110, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();

    // fingertip glows
    [4, 8, 12, 16, 20].forEach(i => {
      const g2 = ctx.createRadialGradient(pts[i].x, pts[i].y, 1, pts[i].x, pts[i].y, 28);
      g2.addColorStop(0, C.glow + '0.28)');
      g2.addColorStop(1, C.glow + '0)');
      ctx.beginPath();
      ctx.arc(pts[i].x, pts[i].y, 28, 0, Math.PI * 2);
      ctx.fillStyle = g2;
      ctx.fill();
    });
  }

  // ── Trails ───────────────────────────────────────────────────────────────
  if (FX.trails) {
    const trail = trailHistory[handIndex];
    trail.push({ x: palmX, y: palmY });
    if (trail.length > MAX_TRAIL) trail.shift();

    for (let i = 1; i < trail.length; i++) {
      const t = i / trail.length;
      const [r,g,b] = C.trail;
      ctx.beginPath();
      ctx.moveTo(trail[i-1].x, trail[i-1].y);
      ctx.lineTo(trail[i].x,   trail[i].y);
      ctx.strokeStyle = `rgba(${r},${g},${b},${t * 0.65})`;
      ctx.lineWidth   = t * 5;
      ctx.lineCap     = 'round';
      ctx.stroke();
    }
  }

  // ── Skeleton ─────────────────────────────────────────────────────────────
  if (FX.skeleton) {
    // Connection map: [from, to] indices matching MediaPipe hand topology
    const connections = [
      [0,1],[1,2],[2,3],[3,4],       // thumb
      [0,5],[5,6],[6,7],[7,8],       // index
      [0,9],[9,10],[10,11],[11,12],  // middle
      [0,13],[13,14],[14,15],[15,16],// ring
      [0,17],[17,18],[18,19],[19,20],// pinky
      [5,9],[9,13],[13,17],          // palm arc
    ];

    ctx.lineWidth = 1.8;
    connections.forEach(([a, b]) => {
      ctx.beginPath();
      ctx.moveTo(pts[a].x, pts[a].y);
      ctx.lineTo(pts[b].x, pts[b].y);
      ctx.strokeStyle = C.skeleton + '0.65)';
      ctx.stroke();
    });

    // Joints
    pts.forEach((pt, i) => {
      const isWrist = i === 0;
      const isTip   = [4, 8, 12, 16, 20].includes(i);
      const r = isWrist ? 6 : isTip ? 5 : 3;

      if (FX.glow) {
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, r + 5, 0, Math.PI * 2);
        ctx.fillStyle = C.glow + '0.12)';
        ctx.fill();
      }

      ctx.beginPath();
      ctx.arc(pt.x, pt.y, r, 0, Math.PI * 2);
      ctx.fillStyle = isWrist ? C.wrist : C.joint;
      ctx.fill();
    });
  }

  // ── Particles ─────────────────────────────────────────────────────────────
  if (FX.particles) {
    // Emit from fingertips
    [4, 8, 12, 16, 20].forEach(i => {
      if (Math.random() < 0.4) spawnParticle(pts[i].x, pts[i].y);
    });
  }
}

// ─── RENDER LOOP ───────────────────────────────────────────────────────────
let lastResults = null;

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (lastResults && lastResults.multiHandLandmarks) {
    lastResults.multiHandLandmarks.forEach((landmarks, i) => {
      drawHand(landmarks, i);
    });
  }

  if (FX.particles) updateParticles();

  requestAnimationFrame(render);
}
render();

// ─── MEDIAPIPE SETUP ───────────────────────────────────────────────────────
function startTracking() {
  document.getElementById('start-screen').style.display = 'none';
  const statusEl = document.getElementById('status');
  statusEl.textContent = 'Starting camera...';

  const hands = new Hands({
    locateFile: file =>
      `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
  });

  hands.setOptions({
    maxNumHands:          2,
    modelComplexity:      1,
    minDetectionConfidence: 0.7,
    minTrackingConfidence:  0.6,
  });

  hands.onResults(results => {
    lastResults = results;
    const detected = results.multiHandLandmarks && results.multiHandLandmarks.length > 0;
    statusEl.textContent = detected
      ? `${results.multiHandLandmarks.length} hand${results.multiHandLandmarks.length > 1 ? 's' : ''} detected`
      : 'Show your hands';
    statusEl.className = detected ? 'ready' : '';
  });

  const camera = new Camera(video, {
    onFrame: async () => { await hands.send({ image: video }); },
    width: 1280,
    height: 720,
  });

  camera.start()
    .then(() => {
      statusEl.textContent = 'Show your hands';
      statusEl.className = 'ready';
    })
    .catch(err => {
      statusEl.textContent = 'Camera error — check permissions';
      statusEl.className = 'error';
      console.error('Camera error:', err);
    });
}

document.getElementById('start-btn').addEventListener('click', startTracking);
</script>
</body>
</html>
